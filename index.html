<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日の散歩</title>
<style>
  :root{
    --cream: #f4ecd8;
    --cream-deep: #ece1c8;
    --navy: #2b3a52;
    --navy-soft: #3d4f6b;
    --terracotta: #d99a6c;
    --terracotta-deep: #cf8a55;
    --sage: #93a97e;
    --sage-deep: #7d9468;
    --cream-card: #faf5e9;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #d9d0ba;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .phone {
    width: 320px;
    height: 660px;
    background: var(--cream);
    border-radius: 40px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
    border: 8px solid #1c2534;
    display: flex;
    flex-direction: column;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 22px 4px;
    font-size: 14px;
    font-weight: 600;
    color: var(--navy);
  }
  .status-icons { display: flex; gap: 5px; align-items: center; }
  .status-icons svg { display: block; }

  /* Top nav row */
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 22px 0;
  }
  .menu-icon {
    width: 22px; height: 16px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .menu-icon span { display:block; height: 2.5px; background: var(--navy); border-radius: 2px; }

  .paw-badge {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 2px solid var(--navy);
    display: flex; align-items: center; justify-content: center;
    color: var(--navy);
  }

  /* Title area */
  .title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 14px 22px 0;
  }
  .title-jp {
    font-size: 26px;
    font-weight: 800;
    color: var(--navy);
    margin: 0;
    letter-spacing: 0.5px;
  }
  .title-en {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--sage-deep);
    margin-top: 2px;
  }

  .stamp {
    border: 1.5px dashed var(--navy);
    border-radius: 6px;
    padding: 6px 10px;
    text-align: center;
    color: var(--navy);
    transform: rotate(3deg);
    background: rgba(255,255,255,0.15);
  }
  .stamp .num { font-size: 20px; font-weight: 800; line-height: 1; }
  .stamp .month { font-size: 9px; font-weight: 700; letter-spacing: 1px; margin-top: 2px; }

  /* Illustration circle */
  .illust-wrap {
    position: relative;
    margin: 14px auto 0;
    width: 260px;
    height: 260px;
  }
  .illust-circle {
    width: 240px;
    height: 240px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #c9d6bb, #a9bd97 70%, #93a97e 100%);
    margin: 0 auto;
    position: relative;
    overflow: hidden;
  }

  .cloud {
    position: absolute;
    background: #eef1e6;
    border-radius: 50px;
    opacity: 0.85;
  }

  .hill {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: #7d9468;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }

  .house {
    position: absolute;
    bottom: 46px;
    left: 34px;
  }

  .dog-svg {
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 240px;
    z-index: 3;
  }

  .paw-corner {
    position: absolute;
    right: 6px;
    bottom: 4px;
    color: var(--navy);
    opacity: 0.9;
  }

  /* Name area */
  .name-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 4px 26px 0;
    margin-top: -6px;
  }
  .name-jp {
    font-size: 24px;
    font-weight: 800;
    color: var(--navy);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .name-en {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--navy-soft);
  }
  .breed-row {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--sage-deep);
    font-weight: 700;
    padding: 2px 26px 0;
  }
  .paw-side { color: var(--navy); opacity: 0.85; }

  /* Swipe button */
  .swipe-wrap {
    margin: 18px 22px 0;
    position: relative;
    height: 58px;
    background: var(--terracotta);
    border-radius: 30px;
    display: flex;
    align-items: center;
    overflow: hidden;
    box-shadow: 0 6px 14px rgba(207,138,85,0.4);
    user-select: none;
  }

  .swipe-text {
    width: 100%;
    text-align: center;
    color: var(--navy);
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .swipe-text .jp { font-size: 15px; font-weight: 800; }
  .swipe-text .en { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; margin-top: 1px; }

  .swipe-thumb {
    position: absolute;
    left: 4px;
    top: 4px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--terracotta);
    cursor: grab;
    touch-action: none;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    z-index: 2;
    transition: left 0.25s ease;
  }
  .swipe-thumb:active { cursor: grabbing; }
  .swipe-thumb.settled { transition: left 0.25s ease; }

  .swipe-wrap.completed {
    background: var(--sage-deep);
    box-shadow: 0 6px 14px rgba(125,148,104,0.45);
  }
  .swipe-wrap.completed .swipe-thumb { color: var(--sage-deep); }

  /* Bottom nav */
  .bottom-nav {
    margin-top: auto;
    display: flex;
    justify-content: space-around;
    padding: 14px 10px 18px;
    background: var(--cream-deep);
    border-top: 1px solid rgba(43,58,82,0.12);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--navy);
    opacity: 0.55;
  }
  .nav-item.active { opacity: 1; }
  .nav-item span { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }

  @media (prefers-reduced-motion: reduce) {
    .swipe-thumb, .swipe-text { transition: none; }
  }
</style>
</head>
<body>

<div class="phone">

  <!-- Status bar -->
  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="currentColor"/><rect x="4.5" y="6" width="3" height="6" rx="0.5" fill="currentColor"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="currentColor"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="currentColor"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 10.5c-2.5 0-4.7-1-6.3-2.6l1.4-1.4C4.4 7.8 6.1 8.5 8 8.5s3.6-.7 4.9-2l1.4 1.4C12.7 9.5 10.5 10.5 8 10.5z" fill="currentColor"/><path d="M8 6.2c-1.3 0-2.5.5-3.4 1.4L3.2 6.2C4.5 4.9 6.2 4.2 8 4.2s3.5.7 4.8 2l-1.4 1.4C10.5 6.7 9.3 6.2 8 6.2z" fill="currentColor"/><circle cx="8" cy="10.5" r="1" fill="currentColor"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="currentColor" fill="none"/><rect x="2" y="2" width="15" height="8" rx="1.2" fill="currentColor"/><rect x="22.5" y="4" width="1.5" height="4" rx="0.7" fill="currentColor"/></svg>
    </div>
  </div>

  <!-- Menu + paw badge -->
  <div class="top-row">
    <div class="menu-icon"><span></span><span></span><span></span></div>
    <div class="paw-badge">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <ellipse cx="7" cy="8" rx="2.1" ry="2.8"/>
        <ellipse cx="12" cy="6" rx="2.2" ry="3"/>
        <ellipse cx="17" cy="8" rx="2.1" ry="2.8"/>
        <path d="M12 12c-3 0-5.5 2.2-5.5 5 0 1.8 1.6 3 3.4 2.6.7-.2 1.4-.5 2.1-.5s1.4.3 2.1.5c1.8.4 3.4-.8 3.4-2.6 0-2.8-2.5-5-5.5-5z"/>
      </svg>
    </div>
  </div>

  <!-- Title -->
  <div class="title-row">
    <div>
      <p class="title-jp">今日の散歩</p>
      <div class="title-en">TODAY'S WALK</div>
    </div>
    <div class="stamp">
      <div class="num">05</div>
      <div class="month">月 MAY</div>
    </div>
  </div>

  <!-- Illustration -->
  <div class="illust-wrap">
    <div class="illust-circle">
      <div class="cloud" style="width:34px;height:14px;top:22px;left:20px;"></div>
      <div class="cloud" style="width:44px;height:16px;top:34px;left:150px;"></div>
      <div class="cloud" style="width:26px;height:11px;top:14px;left:170px;"></div>
      <div class="hill"></div>
      <svg class="house" width="40" height="46" viewBox="0 0 40 46">
        <rect x="8" y="20" width="24" height="24" fill="#eef1e6" opacity="0.9"/>
        <polygon points="4,22 20,6 36,22" fill="#2b3a52" opacity="0.85"/>
        <rect x="17" y="30" width="8" height="14" fill="#2b3a52" opacity="0.6"/>
      </svg>
      <svg width="26" height="70" viewBox="0 0 26 70" style="position:absolute; bottom:0; right:38px;">
        <rect x="10" y="0" width="6" height="70" fill="#4d6b45"/>
        <circle cx="13" cy="14" r="16" fill="#7d9468"/>
      </svg>
    </div>

    <!-- Dog illustration -->
    <svg class="dog-svg" viewBox="0 0 240 210" xmlns="http://www.w3.org/2000/svg">
      <!-- leash line -->
      <path d="M40 150 C10 165, -10 180, -30 210" stroke="#2b3a52" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- back legs -->
      <rect x="150" y="150" width="14" height="45" rx="6" fill="#f4ecd8" stroke="#2b3a52" stroke-width="2.5"/>
      <rect x="180" y="150" width="14" height="45" rx="6" fill="#2b3a52"/>
      <!-- tail -->
      <path d="M205 110 Q230 95 222 70" stroke="#d99a6c" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M205 110 Q230 95 222 70" stroke="#2b3a52" stroke-width="14" fill="none" stroke-linecap="round" opacity="0" />
      <!-- body -->
      <ellipse cx="150" cy="120" rx="65" ry="42" fill="#f7efdd" stroke="#2b3a52" stroke-width="3"/>
      <path d="M100 100 Q140 80 190 100 Q190 140 150 155 Q110 145 100 100Z" fill="#2b3a52" opacity="0.9"/>
      <!-- front legs -->
      <rect x="88" y="140" width="15" height="55" rx="6" fill="#f4ecd8" stroke="#2b3a52" stroke-width="2.5"/>
      <rect x="118" y="140" width="15" height="55" rx="6" fill="#f4ecd8" stroke="#2b3a52" stroke-width="2.5"/>
      <!-- harness/leash strap -->
      <path d="M75 105 L60 175" stroke="#2b3a52" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="75" cy="105" rx="8" ry="6" fill="none" stroke="#2b3a52" stroke-width="3"/>
      <!-- neck/chest -->
      <ellipse cx="80" cy="115" rx="30" ry="35" fill="#f7efdd" stroke="#2b3a52" stroke-width="3"/>
      <!-- head -->
      <g transform="translate(45,30)">
        <ellipse cx="35" cy="60" rx="38" ry="34" fill="#f4ecd8" stroke="#2b3a52" stroke-width="3"/>
        <!-- ears -->
        <path d="M4 40 Q-10 65 8 90 Q22 78 20 55Z" fill="#d99a6c" stroke="#2b3a52" stroke-width="2.5"/>
        <path d="M66 40 Q80 65 62 90 Q48 78 50 55Z" fill="#d99a6c" stroke="#2b3a52" stroke-width="2.5"/>
        <!-- top fur patch -->
        <path d="M8 35 Q35 10 62 35 Q55 20 35 18 Q15 20 8 35Z" fill="#d99a6c"/>
        <!-- snout -->
        <ellipse cx="35" cy="78" rx="20" ry="16" fill="#faf5e9" stroke="#2b3a52" stroke-width="2.5"/>
        <ellipse cx="35" cy="74" rx="7" ry="5" fill="#2b3a52"/>
        <path d="M35 79 L35 86" stroke="#2b3a52" stroke-width="2" stroke-linecap="round"/>
        <path d="M35 86 Q28 90 24 86" stroke="#2b3a52" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M35 86 Q42 90 46 86" stroke="#2b3a52" stroke-width="2" fill="none" stroke-linecap="round"/>
        <!-- eyes -->
        <circle cx="20" cy="58" r="4.2" fill="#2b3a52"/>
        <circle cx="50" cy="58" r="4.2" fill="#2b3a52"/>
        <circle cx="18.5" cy="56.5" r="1.2" fill="#fff"/>
        <circle cx="48.5" cy="56.5" r="1.2" fill="#fff"/>
        <!-- eyebrow tufts -->
        <path d="M10 48 Q18 42 26 48" stroke="#2b3a52" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M44 48 Q52 42 60 48" stroke="#2b3a52" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
    </svg>

    <div class="paw-corner">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <ellipse cx="7" cy="8" rx="2.1" ry="2.8"/>
        <ellipse cx="12" cy="6" rx="2.2" ry="3"/>
        <ellipse cx="17" cy="8" rx="2.1" ry="2.8"/>
        <path d="M12 12c-3 0-5.5 2.2-5.5 5 0 1.8 1.6 3 3.4 2.6.7-.2 1.4-.5 2.1-.5s1.4.3 2.1.5c1.8.4 3.4-.8 3.4-2.6 0-2.8-2.5-5-5.5-5z"/>
      </svg>
    </div>
  </div>

  <!-- Name -->
  <div class="name-row">
    <div class="name-jp">モモ <span class="name-en">MOMO</span></div>
    <div class="paw-side">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <ellipse cx="7" cy="8" rx="2.1" ry="2.8"/>
        <ellipse cx="12" cy="6" rx="2.2" ry="3"/>
        <ellipse cx="17" cy="8" rx="2.1" ry="2.8"/>
        <path d="M12 12c-3 0-5.5 2.2-5.5 5 0 1.8 1.6 3 3.4 2.6.7-.2 1.4-.5 2.1-.5s1.4.3 2.1.5c1.8.4 3.4-.8 3.4-2.6 0-2.8-2.5-5-5.5-5z"/>
      </svg>
    </div>
  </div>
  <div class="breed-row">FOX TERRIER</div>

  <!-- Swipe to confirm -->
  <div class="swipe-wrap" id="swipeWrap">
    <div class="swipe-thumb" id="swipeThumb">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="thumbIcon">
        <ellipse cx="7" cy="8" rx="2.1" ry="2.8"/>
        <ellipse cx="12" cy="6" rx="2.2" ry="3"/>
        <ellipse cx="17" cy="8" rx="2.1" ry="2.8"/>
        <path d="M12 12c-3 0-5.5 2.2-5.5 5 0 1.8 1.6 3 3.4 2.6.7-.2 1.4-.5 2.1-.5s1.4.3 2.1.5c1.8.4 3.4-.8 3.4-2.6 0-2.8-2.5-5-5.5-5z"/>
      </svg>
    </div>
    <div class="swipe-text" id="swipeText">
      <div class="jp">散歩完了！</div>
      <div class="en">SWIPE TO CONFIRM</div>
    </div>
  </div>

  <!-- Bottom nav -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg>
      <span>ホーム</span>
    </div>
    <div class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="12" width="4" height="8"/><rect x="10" y="7" width="4" height="13"/><rect x="16" y="3" width="4" height="17"/></svg>
      <span>記録</span>
    </div>
    <div class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="2"/><line x1="8" y1="3" x2="8" y2="7" stroke="currentColor" stroke-width="2"/><line x1="16" y1="3" x2="16" y2="7" stroke="currentColor" stroke-width="2"/></svg>
      <span>カレンダー</span>
    </div>
    <div class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 13a7.6 7.6 0 000-2l2-1.6-2-3.4-2.4 1a7.7 7.7 0 00-1.7-1L15 3h-6l-.3 2a7.7 7.7 0 00-1.7 1l-2.4-1-2 3.4L4.6 11a7.6 7.6 0 000 2l-2 1.6 2 3.4 2.4-1a7.7 7.7 0 001.7 1L9 21h6l.3-2a7.7 7.7 0 001.7-1l2.4 1 2-3.4z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span>設定</span>
    </div>
  </div>

</div>

<script>
  const wrap = document.getElementById('swipeWrap');
  const thumb = document.getElementById('swipeThumb');
  const text = document.getElementById('swipeText');
  const thumbIcon = document.getElementById('thumbIcon');

  let dragging = false;
  let startX = 0;
  let currentX = 4;
  let completed = false;

  const trackPadding = 4;
  const thumbSize = 50;

  function getMaxX() {
    return wrap.clientWidth - thumbSize - trackPadding;
  }

  function setThumbX(x, animate) {
    thumb.style.transition = animate ? 'left 0.25s ease' : 'none';
    thumb.style.left = x + 'px';
    const progress = Math.max(0, Math.min(1, (x - trackPadding) / (getMaxX() - trackPadding)));
    text.style.opacity = Math.max(0, 1 - progress * 1.6);
  }

  function checkmarkIcon() {
    thumbIcon.outerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" id="thumbIcon"><path d="M5 13l4 4L19 7"/></svg>';
  }

  function pawIcon() {
    const el = document.getElementById('thumbIcon');
    el.outerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="thumbIcon"><ellipse cx="7" cy="8" rx="2.1" ry="2.8"/><ellipse cx="12" cy="6" rx="2.2" ry="3"/><ellipse cx="17" cy="8" rx="2.1" ry="2.8"/><path d="M12 12c-3 0-5.5 2.2-5.5 5 0 1.8 1.6 3 3.4 2.6.7-.2 1.4-.5 2.1-.5s1.4.3 2.1.5c1.8.4 3.4-.8 3.4-2.6 0-2.8-2.5-5-5.5-5z"/></svg>';
  }

  function completeSwipe() {
    completed = true;
    setThumbX(getMaxX(), true);
    wrap.classList.add('completed');
    text.style.opacity = 0;
    checkmarkIcon();
    setTimeout(() => {
      text.innerHTML = '<div class="jp">完了しました！</div><div class="en">WALK LOGGED</div>';
      text.style.transition = 'opacity 0.3s ease';
      text.style.opacity = 1;
    }, 300);
  }

  function resetSwipe() {
    completed = false;
    setThumbX(trackPadding, true);
    wrap.classList.remove('completed');
    text.innerHTML = '<div class="jp">散歩完了！</div><div class="en">SWIPE TO CONFIRM</div>';
    text.style.opacity = 1;
    pawIcon();
  }

  function onPointerDown(e) {
    if (completed) return;
    dragging = true;
    startX = (e.touches ? e.touches[0].clientX : e.clientX) - currentX;
    thumb.style.transition = 'none';
  }

  function onPointerMove(e) {
    if (!dragging || completed) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let x = clientX - startX;
    const maxX = getMaxX();
    x = Math.max(trackPadding, Math.min(maxX, x));
    currentX = x;
    setThumbX(x, false);
  }

  function onPointerUp() {
    if (!dragging || completed) return;
    dragging = false;
    const maxX = getMaxX();
    if (currentX >= maxX * 0.85) {
      currentX = maxX;
      completeSwipe();
    } else {
      currentX = trackPadding;
      setThumbX(trackPadding, true);
      text.style.opacity = 1;
    }
  }

  thumb.addEventListener('mousedown', onPointerDown);
  document.addEventListener('mousemove', onPointerMove);
  document.addEventListener('mouseup', onPointerUp);

  thumb.addEventListener('touchstart', onPointerDown, { passive: true });
  document.addEventListener('touchmove', onPointerMove, { passive: true });
  document.addEventListener('touchend', onPointerUp);

  // click to reset when completed (demo convenience)
  wrap.addEventListener('click', (e) => {
    if (completed && e.target === wrap) resetSwipe();
  });

  // initialize
  window.addEventListener('load', () => setThumbX(trackPadding, false));
</script>

</body>
</html>
