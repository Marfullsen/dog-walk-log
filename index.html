<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日の散歩</title>
<style>
  :root{
    --cream: #f4ecd8;
    --cream-deep: #ece1c8;
    --navy: #2b3a52;
    --navy-soft: #3d4f6b;
    --terracotta: #d99a6c;
    --terracotta-deep: #cf8a55;
    --sage: #93a97e;
    --sage-deep: #7d9468;
    --cream-card: #faf5e9;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #d9d0ba;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .phone {
    width: 320px;
    height: 660px;
    background: var(--cream);
    border-radius: 40px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
    border: 8px solid #1c2534;
    display: flex;
    flex-direction: column;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 22px 4px;
    font-size: 14px;
    font-weight: 600;
    color: var(--navy);
  }
  .status-icons { display: flex; gap: 5px; align-items: center; }
  .status-icons svg { display: block; }

  /* Top nav row */
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 22px 0;
  }
  .menu-icon {
    width: 22px; height: 16px;
    display: flex; flex-direction: column; justify-content: space-between;
    cursor: pointer;
  }
  .menu-icon span { display:block; height: 2.5px; background: var(--navy); border-radius: 2px; }

  .paw-badge {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 2px solid var(--navy);
    display: flex; align-items: center; justify-content: center;
    color: var(--navy);
  }

  /* View system */
  .view-container {
    flex: 1;
    overflow-y: auto;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .view-container::-webkit-scrollbar { display: none; }

  .view {
    display: none;
    flex-direction: column;
    animation: fadeIn 0.28s ease;
    flex: 1;
  }
  .view.active { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Title area */
  .title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 14px 22px 0;
  }
  .title-jp {
    font-size: 26px;
    font-weight: 800;
    color: var(--navy);
    margin: 0;
    letter-spacing: 0.5px;
  }
  .title-en {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--sage-deep);
    margin-top: 2px;
  }

  .stamp {
    border: 1.5px dashed var(--navy);
    border-radius: 6px;
    padding: 6px 10px;
    text-align: center;
    color: var(--navy);
    transform: rotate(3deg);
    background: rgba(255,255,255,0.15);
  }
  .stamp .num { font-size: 20px; font-weight: 800; line-height: 1; }
  .stamp .month { font-size: 9px; font-weight: 700; letter-spacing: 1px; margin-top: 2px; }

  /* Illustration circle */
  .illust-wrap {
    position: relative;
    margin: 14px auto 0;
    width: 260px;
    height: 260px;
    flex-shrink: 0;
  }
  .illust-circle {
    width: 240px;
    height: 240px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #c9d6bb, #a9bd97 70%, #93a97e 100%);
    margin: 0 auto;
    position: relative;
    overflow: hidden;
  }

  .cloud {
    position: absolute;
    background: #eef1e6;
    border-radius: 50px;
    opacity: 0.85;
  }

  .hill {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: #7d9468;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }

  .house {
    position: absolute;
    bottom: 46px;
    left: 34px;
  }

  .dog-svg {
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 240px;
    z-index: 3;
  }

  .paw-corner {
    position: absolute;
    right: 6px;
    bottom: 4px;
    color: var(--navy);
    opacity: 0.9;
  }

  /* Name area */
  .name-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 4px 26px 0;
    margin-top: -6px;
  }
  .name-jp {
    font-size: 24px;
    font-weight: 800;
    color: var(--navy);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .name-en {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--navy-soft);
  }
  .breed-row {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--sage-deep);
    font-weight: 700;
    padding: 2px 26px 0;
  }
  .paw-side { color: var(--navy); opacity: 0.85; }

  .last-walk {
    font-size: 12px;
    color: var(--navy-soft);
    padding: 6px 26px 0;
    font-weight: 600;
  }
  .last-walk span { color: var(--terracotta-deep); }

  /* Swipe button */
  .swipe-wrap {
    margin: 18px 22px 0;
    position: relative;
    height: 58px;
    background: var(--terracotta);
    border-radius: 30px;
    display: flex;
    align-items: center;
    overflow: hidden;
    box-shadow: 0 6px 14px rgba(207,138,85,0.4);
    user-select: none;
  }

  .swipe-text {
    width: 100%;
    text-align: center;
    color: var(--navy);
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .swipe-text .jp { font-size: 15px; font-weight: 800; }
  .swipe-text .en { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; margin-top: 1px; }

  .swipe-thumb {
    position: absolute;
    left: 4px;
    top: 4px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--terracotta);
    cursor: grab;
    touch-action: none;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    z-index: 2;
    transition: left 0.25s ease;
  }
  .swipe-thumb:active { cursor: grabbing; }

  .swipe-wrap.completed {
    background: var(--sage-deep);
    box-shadow: 0 6px 14px rgba(125,148,104,0.45);
  }
  .swipe-wrap.completed .swipe-thumb { color: var(--sage-deep); }

  /* Logs View */
  .stats-row {
    display: flex;
    gap: 8px;
    padding: 10px 22px 14px;
  }
  .stat-card {
    flex: 1;
    background: var(--cream-card);
    border-radius: 16px;
    padding: 12px 8px;
    text-align: center;
    border: 1px solid rgba(43,58,82,0.08);
  }
  .stat-card .num {
    font-size: 22px;
    font-weight: 800;
    color: var(--navy);
  }
  .stat-card .label {
    font-size: 9px;
    font-weight: 700;
    color: var(--sage-deep);
    letter-spacing: 0.5px;
    margin-top: 4px;
  }
  .logs-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 22px 10px;
  }
  .logs-list::-webkit-scrollbar { display: none; }
  .log-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid rgba(43,58,82,0.08);
  }
  .log-info { display: flex; flex-direction: column; gap: 2px; }
  .log-date { font-size: 14px; font-weight: 700; color: var(--navy); }
  .log-time { font-size: 11px; color: var(--navy-soft); font-weight: 600; }
  .log-paw { color: var(--terracotta); }
  .empty-state {
    text-align: center;
    padding: 40px 22px;
    color: var(--navy-soft);
    font-size: 13px;
    font-weight: 600;
  }

  /* Calendar View */
  .calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 22px 14px;
  }
  .calendar-header button {
    background: none;
    border: none;
    color: var(--navy);
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
  }
  .calendar-header button:hover { background: rgba(43,58,82,0.06); }
  .calendar-month {
    font-size: 16px;
    font-weight: 800;
    color: var(--navy);
    letter-spacing: 1px;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    padding: 0 22px;
    text-align: center;
  }
  .cal-weekday {
    font-size: 10px;
    font-weight: 700;
    color: var(--sage-deep);
    padding-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .cal-day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    position: relative;
  }
  .cal-day.other-month { color: rgba(43,58,82,0.25); }
  .cal-day.today {
    border: 2px solid var(--navy);
  }
  .cal-day.has-walk {
    background: var(--terracotta);
    color: #fff;
    box-shadow: 0 2px 6px rgba(207,138,85,0.4);
  }
  .cal-day.has-walk.today {
    border: 2px solid var(--navy);
  }

  /* Settings View */
  .settings-section {
    padding: 6px 22px 14px;
  }
  .setting-item {
    background: var(--cream-card);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    border: 1px solid rgba(43,58,82,0.08);
  }
  .setting-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--sage-deep);
    letter-spacing: 0.8px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .setting-input {
    width: 100%;
    border: none;
    background: transparent;
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    font-family: inherit;
    outline: none;
  }
  .setting-btn {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .btn-danger {
    background: rgba(217, 90, 90, 0.12);
    color: #b54545;
  }
  .btn-secondary {
    background: var(--cream-deep);
    color: var(--navy);
  }
  .setting-note {
    font-size: 11px;
    color: var(--navy-soft);
    text-align: center;
    padding: 8px 0;
  }

  /* Bottom nav */
  .bottom-nav {
    margin-top: auto;
    display: flex;
    justify-content: space-around;
    padding: 14px 10px 18px;
    background: var(--cream-deep);
    border-top: 1px solid rgba(43,58,82,0.12);
    flex-shrink: 0;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--navy);
    opacity: 0.45;
    cursor: pointer;
    transition: opacity 0.2s ease;
    border: none;
    background: none;
    font-family: inherit;
    padding: 0 8px;
  }
  .nav-item:hover { opacity: 0.75; }
  .nav-item.active { opacity: 1; }
  .nav-item span { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }

  @media (prefers-reduced-motion: reduce) {
    .swipe-thumb, .swipe-text, .view { transition: none; animation: none; }
  }
</style>
<base target="_blank">

        </div>
        <div class="stat-card">
          <div class="num" id="statStreak">0</div>
          <div class="label">連続日</div>
        </div>
        <div class="stat-card">
          <div class="num" id="statTotal">0</div>
          <div class="label">合計回</div>
        </div>
      </div>
      <div class="logs-list" id="logsList">
        <div class="empty-state">まだ散歩記録がありません<br>Swipe to log your first walk!</div>
      </div>
    </div>

    <!-- CALENDAR VIEW -->
    <div id="view-calendar" class="view">
      <div class="title-row">
        <div>
          <p class="title-jp">カレンダー</p>
          <div class="title-en">CALENDAR</div>
        </div>
      </div>
      <div class="calendar-header">
        <button onclick="changeMonth(-1)">‹</button>
        <div class="calendar-month" id="calMonthLabel">2026.08</div>
        <button onclick="changeMonth(1)">›</button>
      </div>
      <div class="calendar-grid" id="calGrid">
        <!-- generated -->
      </div>
    </div>

    <!-- SETTINGS VIEW -->
    <div id="view-settings" class="view">
      <div class="title-row">
        <div>
          <p class="title-jp">設定</p>
          <div class="title-en">SETTINGS</div>
        </div>
      </div>
      <div class="settings-section">
        <div class="setting-item">
          <div class="setting-label">愛犬の名前 / DOG NAME</div>
          <input type="text" class="setting-input" id="inputName" value="モモ" maxlength="10">
        </div>
        <div class="setting-item">
          <div class="setting-label">犬種 / BREED</div>
          <input type="text" class="setting-input" id="inputBreed" value="FOX TERRIER" maxlength="20">
        </div>
        <button class="setting-btn btn-secondary" onclick="saveSettings()">プロフィールを保存 / SAVE</button>
        <button class="setting-btn btn-danger" onclick="clearAllData()">データをリセット / RESET DATA</button>
        <div class="setting-note">Dog Walk Log v1.0</div>
      </div>
    </div>

  </div>

  <!-- Bottom nav -->
  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchView('home')" id="nav-home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg>
      <span>ホーム</span>
    </button>
    <button class="nav-item" onclick="switchView('logs')" id="nav-logs">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="12" width="4" height="8"/><rect x="10" y="7" width="4" height="13"/><rect x="16" y="3" width="4" height="17"/></svg>
      <span>記録</span>
    </button>
    <button class="nav-item" onclick="switchView('calendar')" id="nav-calendar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="2"/><line x1="8" y1="3" x2="8" y2="7" stroke="currentColor" stroke-width="2"/><line x1="16" y1="3" x2="16" y2="7" stroke="currentColor" stroke-width="2"/></svg>
      <span>カレンダー</span>
    </button>
    <button class="nav-item" onclick="switchView('settings')" id="nav-settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 13a7.6 7.6 0 000-2l2-1.6-2-3.4-2.4 1a7.7 7.7 0 00-1.7-1L15 3h-6l-.3 2a7.7 7.7 0 00-1.7 1l-2.4-1-2 3.4L4.6 11a7.6 7.6 0 000 2l-2 1.6 2 3.4 2.4-1a7.7 7.7 0 001.7 1L9 21h6l.3-2a7.7 7.7 0 001.7-1l2.4 1 2-3.4z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span>設定</span>
    </button>
  </div>

</div>

<script>
  // =====================
  // DATA & STATE
  // =====================
  const STORAGE_KEY = 'dogwalk-app-v1';

  function getData() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { walks: [], dogName: 'モモ', dogBreed: 'FOX TERRIER' };
    try { return JSON.parse(raw); } catch(e) { return { walks: [], dogName: 'モモ', dogBreed: 'FOX TERRIER' }; }
  }

  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  let appData = getData();
  let currentMonth = new Date().getMonth();
  let currentYear = new Date().getFullYear();

  // =====================
  // VIEW ROUTER
  // =====================
  function switchView(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('view-' + name).classList.add('active');
    document.getElementById('nav-' + name).classList.add('active');

    if (name === 'logs') renderLogs();
    if (name === 'calendar') renderCalendar();
    if (name === 'settings') loadSettings();
  }

  // =====================
  // HOME SCREEN
  // =====================
  function updateHome() {
    const now = new Date();
    document.getElementById('stampDay').textContent = String(now.getDate()).padStart(2, '0');
    const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    document.getElementById('stampMonth').textContent = `月 ${months[now.getMonth()]}`;

    document.getElementById('homeDogName').textContent = appData.dogName;
    document.getElementById('homeDogNameEn').textContent = appData.dogName.toUpperCase();
    document.getElementById('homeDogBreed').textContent = appData.dogBreed;

    const last = appData.walks[appData.walks.length - 1];
    const el = document.getElementById('lastWalkInfo');
    if (last) {
      const d = new Date(last.date);
      const diff = Math.floor((now - d) / (1000*60*60*24));
      let text = '';
      if (diff === 0) text = '最後の散歩: <span>今日</span>';
      else if (diff === 1) text = '最後の散歩: <span>昨日</span>';
      else text = `最後の散歩: <span>${diff}日前</span>`;
      el.innerHTML = text;
    } else {
      el.innerHTML = '最後の散歩: <span>記録なし</span>';
    }
  }

  // =====================
  // SWIPE INTERACTION
  // =====================
  const wrap = document.getElementById('swipeWrap');
  const thumb = document.getElementById('swipeThumb');
  const text = document.getElementById('swipeText');
  const thumbIcon = document.getElementById('thumbIcon');

  let dragging = false;
  let startX = 0;
  let currentX = 4;
  let completed = false;

  const trackPadding = 4;
  const thumbSize = 50;

  function getMaxX() { return wrap.clientWidth - thumbSize - trackPadding; }

  function setThumbX(x, animate) {
    thumb.style.transition = animate ? 'left 0.25s ease' : 'none';
    thumb.style.left = x + 'px';
    const progress = Math.max(0, Math.min(1, (x - trackPadding) / (getMaxX() - trackPadding)));
    text.style.opacity = Math.max(0, 1 - progress * 1.6);
  }

  function checkmarkIcon() {
    thumbIcon.outerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" id="thumbIcon"><path d="M5 13l4 4L19 7"/></svg>';
  }

  function pawIcon() {
    const el = document.getElementById('thumbIcon');
    if (!el) return;
    el.outerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="thumbIcon"><ellipse cx="7" cy="8" rx="2.1" ry="2.8"/><ellipse cx="12" cy="6" rx="2.2" ry="3"/><ellipse cx="17" cy="8" rx="2.1" ry="2.8"/><path d="M12 12c-3 0-5.5 2.2-5.5 5 0 1.8 1.6 3 3.4 2.6.7-.2 1.4-.5 2.1-.5s1.4.3 2.1.5c1.8.4 3.4-.8 3.4-2.6 0-2.8-2.5-5-5.5-5z"/></svg>';
  }

  function completeSwipe() {
    completed = true;
    setThumbX(getMaxX(), true);
    wrap.classList.add('completed');
    text.style.opacity = 0;

    const now = new Date();
    const walk = {
      id: Date.now(),
      date: now.toISOString(),
      dateStr: now.toLocaleDateString('ja-JP'),
      timeStr: now.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}),
      duration: 30
    };
    appData.walks.push(walk);
    saveData(appData);
    updateHome();

    checkmarkIcon();
    setTimeout(() => {
      text.innerHTML = '<div class="jp">完了しました！</div><div class="en">WALK LOGGED</div>';
      text.style.transition = 'opacity 0.3s ease';
      text.style.opacity = 1;
    }, 300);
  }

  function resetSwipe() {
    completed = false;
    setThumbX(trackPadding, true);
    wrap.classList.remove('completed');
    text.innerHTML = '<div class="jp">散歩完了！</div><div class="en">SWIPE TO CONFIRM</div>';
    text.style.opacity = 1;
    pawIcon();
  }

  function onPointerDown(e) {
    if (completed) return;
    dragging = true;
    startX = (e.touches ? e.touches[0].clientX : e.clientX) - currentX;
    thumb.style.transition = 'none';
  }

  function onPointerMove(e) {
    if (!dragging || completed) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let x = clientX - startX;
    const maxX = getMaxX();
    x = Math.max(trackPadding, Math.min(maxX, x));
    currentX = x;
    setThumbX(x, false);
  }

  function onPointerUp() {
    if (!dragging || completed) return;
    dragging = false;
    const maxX = getMaxX();
    if (currentX >= maxX * 0.85) {
      currentX = maxX;
      completeSwipe();
    } else {
      currentX = trackPadding;
      setThumbX(trackPadding, true);
      text.style.opacity = 1;
    }
  }

  thumb.addEventListener('mousedown', onPointerDown);
  document.addEventListener('mousemove', onPointerMove);
  document.addEventListener('mouseup', onPointerUp);

  thumb.addEventListener('touchstart', onPointerDown, { passive: true });
  document.addEventListener('touchmove', onPointerMove, { passive: true });
  document.addEventListener('touchend', onPointerUp);

  wrap.addEventListener('click', (e) => {
    if (completed && e.target === wrap) resetSwipe();
  });

  // =====================
  // LOGS VIEW
  // =====================
  function renderLogs() {
    const list = document.getElementById('logsList');
    if (appData.walks.length === 0) {
      list.innerHTML = '<div class="empty-state">まだ散歩記録がありません<br>Swipe to log your first walk!</div>';
    } else {
      const html = appData.walks.slice().reverse().map(w => `
        <div class="log-item">
          <div class="log-info">
            <div class="log-date">${w.dateStr}</div>
            <div class="log-time">${w.timeStr} · ${w.duration}分</div>
          </div>
          <div class="log-paw">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <ellipse cx="7" cy="8" rx="2.1" ry="2.8"/>
              <ellipse cx="12" cy="6" rx="2.2" ry="3"/>
              <ellipse cx="17" cy="8" rx="2.1" ry="2.8"/>
              <path d="M12 12c-3 0-5.5 2.2-5.5 5 0 1.8 1.6 3 3.4 2.6.7-.2 1.4-.5 2.1-.5s1.4.3 2.1.5c1.8.4 3.4-.8 3.4-2.6 0-2.8-2.5-5-5.5-5z"/>
            </svg>
          </div>
        </div>
      `).join('');
      list.innerHTML = html;
    }

    // Stats
    const now = new Date();
    const weekAgo = new Date(now.getTime() - 7*24*60*60*1000);
    const weekCount = appData.walks.filter(w => new Date(w.date) >= weekAgo).length;

    let streak = 0;
    const today = new Date(); today.setHours(0,0,0,0);
    for (let i = 0; ; i++) {
      const d = new Date(today); d.setDate(d.getDate() - i);
      const has = appData.walks.some(w => {
        const wd = new Date(w.date); wd.setHours(0,0,0,0);
        return wd.getTime() === d.getTime();
      });
      if (has) streak++; else if (i > 0) break;
    }

    document.getElementById('statWeek').textContent = weekCount;
    document.getElementById('statStreak').textContent = streak;
    document.getElementById('statTotal').textContent = appData.walks.length;
  }

  // =====================
  // CALENDAR VIEW
  // =====================
  function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    renderCalendar();
  }

  function renderCalendar() {
    const label = document.getElementById('calMonthLabel');
    label.textContent = `${currentYear}.${String(currentMonth+1).padStart(2,'0')}`;

    const grid = document.getElementById('calGrid');
    const weekdays = ['日','月','火','水','木','金','土'];
    let html = weekdays.map(d => `<div class="cal-weekday">${d}</div>`).join('');

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const prevDays = new Date(currentYear, currentMonth, 0).getDate();

    // previous month padding
    for (let i = firstDay - 1; i >= 0; i--) {
      html += `<div class="cal-day other-month">${prevDays - i}</div>`;
    }

    const today = new Date();
    const walkDates = new Set(appData.walks.map(w => {
      const d = new Date(w.date);
      return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    }));

    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === d;
      const dateKey = `${currentYear}-${currentMonth}-${d}`;
      const hasWalk = walkDates.has(dateKey);
      let cls = 'cal-day';
      if (isToday) cls += ' today';
      if (hasWalk) cls += ' has-walk';
      html += `<div class="${cls}">${d}</div>`;
    }

    // next month padding to fill grid
    const totalCells = firstDay + daysInMonth;
    const nextPadding = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= nextPadding; i++) {
      html += `<div class="cal-day other-month">${i}</div>`;
    }

    grid.innerHTML = html;
  }

  // =====================
  // SETTINGS VIEW
  // =====================
  function loadSettings() {
    document.getElementById('inputName').value = appData.dogName;
    document.getElementById('inputBreed').value = appData.dogBreed;
  }

  function saveSettings() {
    appData.dogName = document.getElementById('inputName').value.trim() || 'モモ';
    appData.dogBreed = document.getElementById('inputBreed').value.trim() || 'FOX TERRIER';
    saveData(appData);
    updateHome();
    alert('プロフィールを保存しました / Profile saved');
  }

  function clearAllData() {
    if (confirm('すべての散歩記録を削除しますか？\nDelete all walk logs?')) {
      appData.walks = [];
      saveData(appData);
      renderLogs();
      renderCalendar();
      updateHome();
      resetSwipe();
    }
  }

  // =====================
  // CLOCK
  // =====================
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock').textContent = `${h}:${m}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // =====================
  // INIT
  // =====================
  window.addEventListener('load', () => {
    setThumbX(trackPadding, false);
    updateHome();
    renderCalendar();
  });
</script>

</body>
</html>
